<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考试作答 — Quick Study</title>
  <link rel="stylesheet" href="styles/mockup.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <style>
    body { background: var(--color-neutral-100); }
    .exam-wrap { max-width: 1280px; margin: 0 auto; padding: 24px; display: flex; gap: 24px; align-items: flex-start; }
    .exam-side { width: 208px; flex-shrink: 0; }
    @media (max-width: 1023px) { .exam-side { display: none; } }
    .exam-main { flex: 1; min-width: 0; }

    .question-card { padding: 24px 32px; }
    @media (max-width: 767px) { .question-card { padding: 20px; } }
    .question-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .question-index { font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--text-primary); }
    .question-index .total { font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--text-tertiary); }
    .exam-stem { font-size: 17px; line-height: var(--leading-relaxed); color: var(--text-primary); font-weight: var(--font-medium); margin-bottom: 24px; }

    .nav-legend { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .nav-legend-item { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--text-secondary); }
    .nav-legend-dot { width: 14px; height: 14px; border-radius: var(--radius-sm); flex-shrink: 0; }
    .nav-legend-dot.current { background: var(--color-primary-500); }
    .nav-legend-dot.answered { background: var(--color-success-500); }
    .nav-legend-dot.unanswered { background: var(--color-neutral-100); border: 1px solid var(--border-default); }
    .nav-legend-dot.review { background: var(--color-warning-500); }

    .nav-summary { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-default); font-size: var(--text-sm); color: var(--text-secondary); }
    .nav-summary .answered-count { color: var(--color-success-600); font-weight: var(--font-semibold); }
    .nav-summary .unanswered-count { color: var(--text-tertiary); font-weight: var(--font-semibold); }

    .exam-nav-buttons { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px solid var(--border-default); margin-top: 24px; }
  </style>
</head>
<body class="min-h-screen">
  <!-- 顶部 sticky 导航（无侧边栏，全屏沉浸式；ExamPage.vue 以 min-h-screen bg-neutral-100 全屏渲染） -->
  <header class="exam-header">
    <div style="display:flex;align-items:center;gap:16px;min-width:0;">
      <h1 class="exam-paper-title" style="font-size:var(--text-lg);font-weight:var(--font-bold);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Java 基础测试卷 (一)</h1>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex-shrink:0;">
      <span class="hidden md:inline text-sm text-neutral-500">
        已答 <span style="color:var(--color-success-600);font-weight:var(--font-semibold);">8</span> / 20 题
      </span>
      <span class="exam-timer">42:15</span>
      <button class="btn btn-danger">
        <span>交卷</span>
      </button>
    </div>
  </header>

  <div class="exam-wrap">
    <!-- 左侧题目导航（hidden lg:block） -->
    <aside class="exam-side">
      <div class="card">
        <div class="card-header">
          <span class="card-title" style="font-size:var(--text-base);">题目导航</span>
        </div>
        <div class="card-body-sm">
          <!-- 状态优先级：current > review(待检查) > answered > unanswered -->
          <div class="q-nav-grid">
            <div class="q-nav-cell answered">1</div>
            <div class="q-nav-cell answered">2</div>
            <div class="q-nav-cell current">3</div>
            <div class="q-nav-cell answered">4</div>
            <div class="q-nav-cell answered">5</div>
            <div class="q-nav-cell answered">6</div>
            <div class="q-nav-cell answered">7</div>
            <div class="q-nav-cell answered">8</div>
            <div class="q-nav-cell review">9</div>
            <div class="q-nav-cell unanswered">10</div>
            <div class="q-nav-cell unanswered">11</div>
            <div class="q-nav-cell unanswered">12</div>
            <div class="q-nav-cell unanswered">13</div>
            <div class="q-nav-cell unanswered">14</div>
            <div class="q-nav-cell unanswered">15</div>
            <div class="q-nav-cell unanswered">16</div>
            <div class="q-nav-cell unanswered">17</div>
            <div class="q-nav-cell unanswered">18</div>
            <div class="q-nav-cell unanswered">19</div>
            <div class="q-nav-cell unanswered">20</div>
          </div>

          <div class="nav-legend">
            <div class="nav-legend-item"><span class="nav-legend-dot current"></span>当前</div>
            <div class="nav-legend-item"><span class="nav-legend-dot answered"></span>已答</div>
            <div class="nav-legend-item"><span class="nav-legend-dot unanswered"></span>未答</div>
            <div class="nav-legend-item"><span class="nav-legend-dot review"></span>待检查</div>
          </div>

          <div class="nav-summary">
            已答：<span class="answered-count">8 题</span> / 未答：<span class="unanswered-count">12 题</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- 答题主区 -->
    <main class="exam-main">
      <div class="card question-card">
        <!-- 题目头部 -->
        <div class="question-header">
          <span class="question-index">第 3 题 <span class="total">/ 共 20 题</span></span>
          <!-- typeTagType: SINGLE/MULTIPLE→primary, FILL_BLANK/SHORT_ANSWER→info, TRUE_FALSE→default -->
          <span class="tag tag-primary">单选题</span>
          <!-- difficultyTagType: EASY→success, MEDIUM→warning, HARD→error -->
          <span class="tag tag-success">简单</span>
          <div style="flex:1;"></div>
          <!-- 未标记态显示「标记待检查」；标记后显示「✓ 已标记待检查」（代码无图标） -->
          <button class="btn btn-ghost btn-sm">
            <span>标记待检查</span>
          </button>
        </div>

        <!-- 题干（RichText） -->
        <div class="exam-stem">
          在 Java 中，以下哪个关键字用于实现继承？
        </div>

        <!-- 作答区：单选题（QuestionOption，marker A/B/C/D） -->
        <div>
          <div class="option-item">
            <div class="option-marker">A</div>
            <div class="option-content">implements</div>
          </div>
          <div class="option-item">
            <div class="option-marker">B</div>
            <div class="option-content">interface</div>
          </div>
          <div class="option-item selected">
            <div class="option-marker">C</div>
            <div class="option-content">extends</div>
          </div>
          <div class="option-item">
            <div class="option-marker">D</div>
            <div class="option-content">inherits</div>
          </div>
        </div>

        <!-- 导航按钮（代码无图标） -->
        <div class="exam-nav-buttons">
          <button class="btn btn-secondary">
            <span>上一题</span>
          </button>
          <button class="btn btn-primary">
            <span>下一题</span>
          </button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
