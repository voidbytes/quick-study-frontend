<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>确认弹窗 — Quick Study</title>
  <link rel="stylesheet" href="styles/mockup.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <style>
    body { background: var(--bg-page); padding: 48px 24px; }
    .demo-section { margin-bottom: 48px; }
    .demo-label { font-size: 14px; font-weight: 600; color: var(--text-tertiary); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
    .demo-bg { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 16px; padding: 48px; position: relative; min-height: 360px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    /* Contain the overlay inside each demo card so dialogs stack vertically */
    .demo-bg .modal-overlay { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div style="max-width:800px;margin:0 auto;">
    <h1 style="font-size:24px;font-weight:700;margin-bottom:32px;">确认弹窗组件</h1>

    <div class="demo-section">
      <div class="demo-label">交卷确认 — Warning</div>
      <div class="demo-bg">
        <div class="modal-overlay">
          <div class="modal confirm-dialog">
            <div class="modal-body" style="text-align:center;">
              <div class="confirm-icon warning">
                <ion-icon name="warning-outline"></ion-icon>
              </div>
              <h2 class="confirm-title">确认交卷？</h2>
              <p class="confirm-desc">你还有 12 题未作答，交卷后将无法修改。确认要提交试卷吗？</p>
              <div class="alert alert-error" style="margin-top:16px;justify-content:center;">
                <ion-icon name="alert-circle-outline" style="font-size:18px;flex-shrink:0;"></ion-icon>
                <span>未作答：12 题</span>
              </div>
            </div>
            <div class="modal-footer" style="justify-content:center;">
              <button class="btn btn-secondary">再检查一下</button>
              <button class="btn btn-primary">
                <ion-icon name="checkmark-outline" style="font-size:18px;"></ion-icon>
                确认交卷
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <div class="demo-label">删除确认 — Danger</div>
      <div class="demo-bg">
        <div class="modal-overlay">
          <div class="modal confirm-dialog">
            <div class="modal-body" style="text-align:center;">
              <div class="confirm-icon danger">
                <ion-icon name="trash-outline"></ion-icon>
              </div>
              <h2 class="confirm-title">确认删除题目？</h2>
              <p class="confirm-desc">删除后不可恢复，该题目关联的所有练习记录也将被清除。</p>
            </div>
            <div class="modal-footer" style="justify-content:center;">
              <button class="btn btn-ghost">取消</button>
              <button class="btn btn-danger">
                <ion-icon name="trash-outline" style="font-size:18px;"></ion-icon>
                确认删除
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
