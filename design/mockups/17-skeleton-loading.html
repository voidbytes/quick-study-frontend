<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骨架屏 — Quick Study</title>
  <link rel="stylesheet" href="styles/mockup.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <style>
    body { background: var(--bg-page); padding: 48px 24px; }
    .demo-wrap { max-width: 1000px; margin: 0 auto; }
    .demo-section { margin-bottom: 48px; }
    .demo-label {
      font-size: 13px; font-weight: 600; color: var(--text-tertiary);
      margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .demo-code {
      font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
      background: var(--bg-subtle); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); padding: 4px 10px; margin-left: 8px;
    }

    /* ---- SkeletonList.vue 实际渲染形态 ---- */
    .skeleton-list { display: grid; gap: var(--space-4); }
    .grid-cols-1 { grid-template-columns: repeat(1, 1fr); }
    .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 768px) {
      .grid-cols-2, .grid-cols-3 { grid-template-columns: 1fr; }
    }
    .sk-item {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
    }
    .sk-line-head { margin-bottom: var(--space-4); }
    .sk-line { height: 14px; border-radius: var(--radius-md); margin-bottom: var(--space-3); }
    .sk-line.short { width: 40%; }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <h1 style="font-size:24px;font-weight:700;margin-bottom:8px;">骨架屏加载态</h1>
    <p style="font-size:13px;color:var(--text-tertiary);margin-bottom:40px;">
      严格对应 <code>SkeletonList.vue</code>：<code>&lt;SkeletonList :count="N" :cols="C" /&gt;</code>。
      每个骨架项由 1 条加粗头行 + 3 条正文行 + 1 条 40% 宽尾行组成，整体按 cols 网格排列。
    </p>

    <!-- cols=1（首页 公开题库 / 公开试卷 加载时） -->
    <div class="demo-section">
      <div class="demo-label">列表骨架<span class="demo-code">:count="3" :cols="1"</span></div>
      <div class="skeleton-list grid-cols-1">
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
      </div>
    </div>

    <!-- cols=2 -->
    <div class="demo-section">
      <div class="demo-label">双列卡片骨架<span class="demo-code">:count="4" :cols="2"</span></div>
      <div class="skeleton-list grid-cols-2">
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
      </div>
    </div>

    <!-- cols=3（默认） -->
    <div class="demo-section">
      <div class="demo-label">三列卡片骨架（默认）<span class="demo-code">:count="3" :cols="3"</span></div>
      <div class="skeleton-list grid-cols-3">
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
        <div class="sk-item">
          <div class="skeleton sk-line sk-line-head"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
