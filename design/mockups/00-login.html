<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="WwhepzC9WFQ0MW8hL9jEvw">
<head data-page-node-id="wsz2XzetoLOhKTW8cgljlU">
  <meta charset="UTF-8" data-page-node-id="AzVxE1FjMwtxQnWvaiyyJt">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="asWoEBH0Okq0hZM8mcby7G">
  <title>登录/注册 — Quick Study</title>
  <link rel="stylesheet" href="styles/mockup.css" data-page-node-id="5LVdS26ioHZntFObOkol5O">
  <style>
    /* Auth tab switcher（来自 AuthLayout.vue） */
    .auth-tabs {
      display: flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-1);
      gap: var(--space-1);
      margin-bottom: var(--space-6);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-weight: var(--font-medium);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-base);
    }
    .auth-tab.active {
      background: var(--bg-card);
      color: var(--text-brand);
      font-weight: var(--font-semibold);
      box-shadow: var(--shadow-sm);
    }
    /* 验证码占位框（来自 Login/Register.vue，captchaEnabled 时显示） */
    .captcha-row { display: flex; gap: var(--space-3); align-items: stretch; }
    .captcha-row .input-group { flex: 1; }
    .captcha-box {
      width: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary-50);
      border: 1px dashed var(--color-primary-300);
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
      letter-spacing: 4px;
      color: var(--text-brand);
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .auth-note {
      text-align: center;
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      margin-top: var(--space-4);
    }
    /* 邀请码字段（Register.vue：v-if="inviteCodeRequired"） */
    .invite-required { color: var(--color-error-500); margin-left: 2px; }
    .input-mono {
      font-family: var(--font-mono);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .invite-hint {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      margin-top: var(--space-1);
      line-height: var(--leading-normal);
    }
    .invite-footer {
      text-align: center;
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      margin: var(--space-3) 0 0;
    }
    /* 注册失败提示条（错误码 95001–95005） */
    .auth-error {
      display: flex; align-items: center; gap: var(--space-2);
      background: var(--color-error-50); border: 1px solid var(--color-error-100);
      color: var(--color-error-600); border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3); font-size: var(--text-sm);
      margin-bottom: var(--space-3);
    }
    /* Tab 内容切换 */
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
  </style>
</head>

  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script>
    function switchPanel(name) {
      document.querySelectorAll('.auth-tab').forEach(function (t) {
        t.classList.toggle('active', t.dataset.panel === name);
      });
      document.querySelectorAll('.auth-panel').forEach(function (p) {
        p.classList.toggle('active', p.id === 'panel-' + name);
      });
    }
  </script>
